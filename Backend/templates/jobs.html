{% extends "base.html" %}

{% block content %}

<div class="hero">

<h1>Latest Jobs 💼</h1>

<p>

Find opportunities that match your skills.

</p>

</div>

<div class="row g-4">

{% for job in jobs %}

<div class="col-md-6">

<div class="card p-4">

<h4>

{{ job.title }}

</h4>

<p>

<strong>Company:</strong>

{{ job.company }}

</p>

<p>

<strong>Location:</strong>

{{ job.location }}

</p>

<p>

<strong>Salary:</strong>

{{ job.salary }}

</p>

<a href="{{ job.link }}"

target="_blank"

class="btn btn-primary">

Apply Now

</a>

</div>

</div>

{% empty %}

<div class="col-12">

<div class="alert alert-info">

No jobs available.

</div>

</div>

{% endfor %}

</div>

{% endblock %}
