{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-info text-white">
            <h2 class="text-center">💼 AI Career Guidance</h2>
        </div>

        <div class="card-body">

            <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label"><strong>Your Interests</strong></label>

                    <textarea
                        name="interests"
                        class="form-control"
                        rows="8"
                        placeholder="Example: I am an ECE student. I know Python, Django and MySQL. I want to become a Backend Developer."
                        required></textarea>
                </div>

                <button type="submit" class="btn btn-info">
                    Get Career Advice
                </button>

            </form>

        </div>

    </div>

    {% if advice %}

    <div class="card shadow mt-4">

        <div class="card-header bg-success text-white">
            <h4>Career Advice</h4>
        </div>

        <div class="card-body">

            <pre style="white-space: pre-wrap;">{{ advice }}</pre>

        </div>

    </div>

    {% endif %}

</div>

{% endblock %}
