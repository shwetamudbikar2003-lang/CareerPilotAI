{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-warning text-dark">
            <h2 class="text-center">🎤 AI Interview Practice</h2>
        </div>

        <div class="card-body">

            <form method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label"><strong>Job Role</strong></label>

                    <input
                        type="text"
                        name="role"
                        class="form-control"
                        placeholder="Enter job role (Example: Python Developer)"
                        required>
                </div>

                <button type="submit" class="btn btn-warning">
                    Generate Interview Questions
                </button>

            </form>

        </div>

    </div>

    {% if questions %}

    <div class="card shadow mt-4">

        <div class="card-header bg-success text-white">
            <h4>Generated Interview Questions</h4>
        </div>

        <div class="card-body">

            <pre style="white-space: pre-wrap;">{{ questions }}</pre>

        </div>

    </div>

    {% endif %}

</div>

{% endblock %}
